site_name: 华信 GEO 文档
site_description: 华信 GEO 监测相关文档

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

draft_docs: |
  geo_docs/README.md
  geo_docs/geo测试.md
  geo_docs/华信GEO监测测试问题设计.md

nav:
  - 首页: index.md
  - GEO:
      - 监测指标概念: geo_docs/华信GEO监测指标概念文档.md

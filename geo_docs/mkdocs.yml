site_name: 华信 GEO 文档
site_description: 华信 GEO 监测相关文档
site_url: https://koishi1514.github.io/git_docs/geo_docs/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

exclude_docs: |
  README.md

nav:
  - 首页: index.md
  - GEO测试内容: geo测试.md
  - 监测指标概念: 华信GEO监测指标概念文档.md
  - 监测测试问题设计: 华信GEO监测测试问题设计.md
